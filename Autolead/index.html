<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoLead | Centralized Lead Management Portal</title>
  <link rel="icon" type="image/png" href="asset/icon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/main.js"></script>
</head>
<body class="auth-page">

  <!-- Top Utility Bar -->
  <header class="auth-topbar">
    <a href="index.html" class="auth-topbar-brand">
      <img src="asset/logo.png" alt="AutoLead Logo">
    </a>
    <button type="button" class="icon-btn" id="themeToggleBtn" data-theme-toggle aria-label="Toggle color theme" title="Toggle Dark/Light Mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>
  </header>

  <!-- Central Login Card -->
  <main class="auth-wrapper">
    <section class="auth-card" aria-labelledby="authHeading">
      <div class="auth-brand-header">
        <img src="asset/logo.png" alt="AutoLead Brand Logo" class="auth-logo-img">
        <h1 id="authHeading">Sign In to AutoLead</h1>
        <p id="authSubheading">Select your workspace role and enter your credentials</p>
      </div>

      <!-- Admin / Employee Role Toggle -->
      <div class="role-toggle-group" role="tablist" aria-label="Select Portal Role">
        <button type="button" class="role-toggle-btn active" id="roleAdminBtn" data-role="admin" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <span>Admin Panel</span>
        </button>
        <button type="button" class="role-toggle-btn" id="roleEmployeeBtn" data-role="employee" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span>Employee Panel</span>
        </button>
      </div>

      <!-- Status / Validation Alert -->
      <div id="authAlert" class="auth-alert" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="authAlertText"></span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form" novalidate>
        <input type="hidden" id="roleInput" name="role" value="admin">

        <div class="form-group">
          <label for="identifierInput" class="form-label" id="identifierLabel">Admin Code or Username</label>
          <div class="input-icon-wrapper">
            <svg class="input-leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input
              type="text"
              id="identifierInput"
              name="identifier"
              class="form-control"
              placeholder="e.g. ADMIN01 or admin"
              autocomplete="username"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="passwordInput" class="form-label">Password</label>
          <div class="input-icon-wrapper">
            <svg class="input-leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              type="password"
              id="passwordInput"
              name="password"
              class="form-control"
              placeholder="Enter password"
              autocomplete="current-password"
              required
            >
            <button type="button" class="password-toggle-btn" id="togglePasswordBtn" aria-label="Show or hide password">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary auth-submit-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          <span>Sign In to Workspace</span>
        </button>
      </form>

      <!-- Quick-Fill Seed Accounts for Instant Testing -->
      <div class="demo-credentials-box">
        <div class="demo-credentials-title">
          <span>Quick-Fill Seed Accounts</span>
          <span>Pass: password123</span>
        </div>
        <div class="demo-chip-grid">
          <button type="button" class="demo-chip" data-fill-role="admin" data-fill-id="ADMIN01">
            <span>ADMIN01</span>
            <span class="chip-role">Admin</span>
          </button>
          <button type="button" class="demo-chip" data-fill-role="employee" data-fill-id="EMP001">
            <span>EMP001</span>
            <span class="chip-role">Arjun M.</span>
          </button>
          <button type="button" class="demo-chip" data-fill-role="employee" data-fill-id="EMP002">
            <span>EMP002</span>
            <span class="chip-role">Priya S.</span>
          </button>
          <button type="button" class="demo-chip" data-fill-role="employee" data-fill-id="EMP003">
            <span>EMP003</span>
            <span class="chip-role">Rohan V.</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <footer class="auth-footer">
    <span>AutoLead Dual-Panel Lead Monitoring &amp; Management System</span>
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
