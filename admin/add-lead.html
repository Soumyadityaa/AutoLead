<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoLead - Add New Lead</title>
    <link rel="icon" href="../img/icon.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin/add-lead.css">
</head>
<body>
    <header class="top-nav" id="admin-top-nav">
        <div class="nav-brand">
            <a href="dashboard.html">
                <img src="../img/logo.png" alt="AutoLead Logo" class="brand-logo">
            </a>
        </div>
        
        <!-- Mobile Menu Toggle Button -->
        <button class="mobile-menu-toggle" id="mobile-menu-btn" aria-label="Toggle Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>

        <nav class="nav-links" id="nav-links">
            <a href="dashboard.html">DASHBOARD</a>
            
            <a href="employee-monitoring.html">View Monitoring</a>
            <a href="tasks.html">Task</a>
           
            <a href="analytics.html">Quick View</a>
            <a href="add-lead.html" class="active">Add Lead</a>
            
            <!-- Theme Toggle Button -->
            <button id="theme-toggle" class="theme-toggle-btn nav-theme-btn" aria-label="Toggle Dark Mode">
                <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                    <circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>

            <a href="../index.html" class="logout-link">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 4px;">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Logout
            </a>
        </nav>
    </header>

    <main class="main-content" id="admin-main">
        <div class="page-header">
            <h2>Add New Prospect</h2>
            <p class="subtitle" style="color: var(--text-light); font-size: 0.95rem;">Manually input new lead data and assign them to an employee for immediate follow-up.</p>
        </div>

        <section class="card form-card">
            <div class="card-header">
                <h3>Lead Information Details</h3>
            </div>
            
            <form id="add-lead-form" class="data-entry-form" novalidate>
                <div class="form-grid">
                    
                    <!-- Lead Name -->
                    <div class="form-group">
                        <label for="lead-name">Full Name <span class="required-asterisk">*</span></label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            <input type="text" id="lead-name" name="lead-name" placeholder="e.g. Jane Doe" required>
                        </div>
                    </div>

                    <!-- Email Address -->
                    <div class="form-group">
                        <label for="lead-email">Email Address <span class="required-asterisk">*</span></label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                            <input type="email" id="lead-email" name="lead-email" placeholder="e.g. jane@example.com" required>
                        </div>
                    </div>

                    <!-- Phone Number -->
                    <div class="form-group">
                        <label for="lead-phone">Phone Number <span class="required-asterisk">*</span></label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                            <input type="tel" id="lead-phone" name="lead-phone" placeholder="e.g. +1 555 123 4567" required>
                        </div>
                    </div>

                    <!-- Age -->
                    <div class="form-group">
                        <label for="lead-age">Age</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                            <input type="number" id="lead-age" name="lead-age" placeholder="e.g. 35" min="18" max="100">
                        </div>
                    </div>

                    <!-- Gender -->
                    <div class="form-group">
                        <label for="lead-gender">Gender</label>
                        <div class="input-wrapper">
                            <select id="lead-gender" name="lead-gender" class="custom-form-select">
                                <option value="" disabled selected>Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other / Prefer not to say</option>
                            </select>
                        </div>
                    </div>

                    <!-- Acquisition Source -->
                    <div class="form-group">
                        <label for="lead-source">Acquisition Source <span class="required-asterisk">*</span></label>
                        <div class="input-wrapper">
                            <select id="lead-source" name="lead-source" class="custom-form-select" required>
                                <option value="" disabled selected>Select Source</option>
                                <option value="website">Organic Website</option>
                                <option value="referral">Direct Referral</option>
                                <option value="social">Social Media (LinkedIn/X)</option>
                                <option value="manual">Manual Entry / Event</option>
                            </select>
                        </div>
                    </div>
                </div>

                <hr class="form-divider">

                <!-- Assignment Section -->
                <div class="card-header" style="border: none; padding-bottom: 0; margin-top: 1rem;">
                    <h3>Assignment Configuration</h3>
                </div>
                
                <div class="form-grid">
                    <!-- Assign To -->
                    <div class="form-group">
                        <label for="assign-to">Assign to Employee <span class="required-asterisk">*</span></label>
                        <div class="input-wrapper">
                            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
                            <select id="assign-to" name="assign-to" class="custom-form-select" required>
                                <option value="" disabled selected>Select Employee</option>
                                <option value="EMP001">EMP001 - Alice Carter</option>
                                <option value="EMP002">EMP002 - Bob Ross</option>
                                <option value="EMP003">EMP003 - Charlie Davis</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="window.location.href='dashboard.html'">Cancel</button>
                    <button type="submit" class="btn-submit" id="submit-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                        Save Lead Record
                    </button>
                </div>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-bottom" style="padding: 1rem; text-align: center; font-size: 0.9rem; opacity: 0.8;">
            <p>&copy; 2026 AutoLead Admin Panel. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/admin/add-lead.js"></script>
</body>
</html>
